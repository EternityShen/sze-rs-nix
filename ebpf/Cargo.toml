# =============================================================================
# ebpf/Cargo.toml - eBPF 程序包配置文件
# =============================================================================
#
# 【文件作用】
# 这是 eBPF（扩展伯克利数据包过滤器）程序的 Cargo 配置文件。
# eBPF 是一种革命性技术，允许在 Linux 内核中安全地运行沙盒程序，
# 无需修改内核源码或加载内核模块。
#
# 【现实比喻】
# 想象 Linux 内核是一个高度安全的银行金库：
# - 传统方式：要进入金库工作，需要修改金库结构（修改内核源码）或
#   添加新房间（加载内核模块），这既危险又复杂
# - eBPF 方式：银行提供了一个特殊的"透明工作室"，你可以在里面工作，
#   可以观察金库内的一切，但不能破坏任何东西。这就是 eBPF！
#
# 【本项目的作用】
# 这个 eBPF 程序会在每次 CPU 发生任务切换时被触发，
# 记录 CPU 是在"忙碌"还是"空闲"状态，从而计算 CPU 负载。
# 就像在工厂门口放一个计数器，记录每个工人的进出时间。
# =============================================================================

# -----------------------------------------------------------------------------
# [package] - 包基本信息配置段
# -----------------------------------------------------------------------------
# 定义这个 Rust 包的基本元数据信息。
# 就像一个人的身份证，包含姓名、年龄等基本信息。
[package]

# name - 包名称
# 这个名称会在编译后生成对应的文件名（libebpf.so）
# 就像产品的品牌名称，用于在项目中唯一标识这个包
name = "ebpf"

# version - 版本号
# 遵循语义化版本规范（Semantic Versioning）：主版本号.次版本号.修订号
# - 主版本号：不兼容的 API 变更
# - 次版本号：向后兼容的功能新增
# - 修订号：向后兼容的问题修复
version = "0.1.0"

# edition - Rust 版本
# "2021" 表示使用 Rust 2021 版本的语言特性和标准库
# Rust 每 3 年发布一个新版本，每个版本可能引入一些不兼容的改进
# 就像汽车的不同年款，新版本有更好的性能和功能
edition = "2021"

# -----------------------------------------------------------------------------
# [lib] - 库目标配置段
# -----------------------------------------------------------------------------
# 定义这个包编译后的产物类型。
# Rust 可以编译成多种类型的产物：可执行文件、库文件等。
[lib]

# crate-type - 库类型
# ["cdylib"] 表示编译为动态链接库（C dynamic library）
#
# 【cdylib 的含义】
# - "c" 表示使用 C 语言调用约定（ABI），方便与其他语言交互
# - "dylib" 表示动态库，在运行时加载
#
# 【为什么用 cdylib？】
# eBPF 程序需要被编译成可以在内核中加载的格式。
# Linux 内核期望的是一个特定格式的 ELF 文件，
# cdylib 会生成一个共享对象文件（.so），正好符合这个要求。
#
# 【现实比喻】
# 就像把你的程序打包成一个"插件"，可以随时插入到内核这个"主程序"中运行
crate-type = ["cdylib"]

# -----------------------------------------------------------------------------
# [dependencies] - 依赖库配置段
# -----------------------------------------------------------------------------
# 声明这个包需要使用的外部库。
# 就像做菜需要的食材清单，每个依赖都是一种"食材"。
[dependencies]

# aya-ebpf - Aya eBPF 框架核心库
# 版本：0.1
#
# 【库的作用】
# aya-ebpf 是 Aya 框架提供的用于编写 eBPF 程序的核心库。
# 它提供了：
# - eBPF 程序的入口点和宏（如 #[tracepoint]）
# - eBPF Map 的定义和操作（如 Array）
# - eBPF helper 函数的安全封装
#
# 【现实比喻】
# aya-ebpf 就像是一个"eBPF 程序员工具箱"：
# - 里面有各种现成的工具（宏、函数）
# - 你不需要从头造轮子，直接使用工具箱里的工具即可
# - 这些工具都是经过安全封装的，不会让你不小心"炸掉"内核
#
# 【为什么选择 Aya？】
# Aya 是一个纯 Rust 编写的 eBPF 库，相比传统的 C 语言 libbpf：
# - 更安全：Rust 的内存安全保证
# - 更现代：充分利用 Rust 的类型系统和宏
# - 更易用：API 设计更加人性化
aya-ebpf = "0.1.1"

# aya-log-ebpf - Aya eBPF 日志库
# 版本：0.1
#
# 【库的作用】
# 提供 eBPF 程序中的日志输出功能。
# 在内核中打印调试信息是非常有用的，但 eBPF 有严格的限制，
# 这个库提供了安全的方式来输出日志。
#
# 【现实比喻】
# 就像在工厂里安装了一个"广播系统"，工人们可以通过它报告状态。
# 但这个广播系统是受限的，不能随便喊话，必须按照规定的格式。
#
# 【注意】
# 本项目目前没有使用日志功能，但保留这个依赖以备将来扩展
aya-log-ebpf = "0.1"

# -----------------------------------------------------------------------------
# [profile.release] - 发布版本编译配置
# -----------------------------------------------------------------------------
# 定义 release 模式下的编译优化选项。
# release 模式用于最终发布，会进行各种优化以提高性能。
# 就像把产品打磨到最精致的状态再出厂。
[profile.release]

# opt-level - 优化级别
# 3 表示最高级别的优化
#
# 【优化级别说明】
# - 0：不优化，编译最快，用于调试
# - 1：基本优化
# - 2：推荐优化级别
# - 3：最高优化，编译最慢，运行最快
# - "s"：优化大小
# - "z"：更激进的大小优化
#
# 【为什么用 3？】
# eBPF 程序对性能要求极高，因为它会在内核的关键路径上执行。
# 每一纳秒都很重要，所以使用最高优化级别。
opt-level = 3

# lto - 链接时优化（Link Time Optimization）
# true 表示启用
#
# 【LTO 的作用】
# 在链接阶段进行跨模块优化，可以：
# - 内联更多函数
# - 删除更多死代码
# - 进行更激进的优化
#
# 【现实比喻】
# 普通优化像是每个工人各自优化自己的工作流程，
# LTO 像是让所有工人坐在一起，统筹优化整个生产流程，
# 发现并消除各个工序之间的冗余。
lto = true

# debug - 调试信息
# false 表示不包含调试信息
#
# 【为什么不包含？】
# 1. 减小文件大小：调试信息会显著增加二进制大小
# 2. eBPF 限制：eBPF 程序有严格的指令数量限制
# 3. 性能考虑：调试信息可能影响加载速度
#
# 【现实比喻】
# 就像在发货前把所有包装材料都去掉，只保留产品本身，
# 这样可以节省空间，提高运输效率
debug = false
